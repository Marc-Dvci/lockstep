[package]
name = "lockstep"
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Marc-Dvci/lockstep"
description = "DAOs pledge to a shared plan; money moves only when the whole plan is funded."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
