# Render Blueprint for the Lockstep demo page (NEAR testnet).
# Secret: WORLD_JSON_B64 = base64 of web/.data/world-testnet.json (testnet demo keys, no value).
services:
  - type: web
    name: lockstep-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node web/server.js
    healthCheckPath: /api/world
    envVars:
      - key: NETWORK
        value: testnet
      - key: NODE_VERSION
        value: "22"
      - key: WORLD_JSON_B64
        sync: false
